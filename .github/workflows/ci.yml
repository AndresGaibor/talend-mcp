name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Validate L5 fixtures
        run: bun run l5:validar

      - name: Run tests
        run: bun test

  plugin:
    name: Plugin Java (Tycho)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4

      - name: Build plugin
        run: mvn -B clean verify -DskipTests
        working-directory: talend-studio-bridge

      - name: Verify plugin.xml is packaged
        run: |
          JAR=$(ls com.andres.talend.bridge/target/*.jar | head -n 1)
          unzip -l "$JAR" | grep -q 'plugin.xml' || (echo "plugin.xml no esta en el jar" && exit 1)
          unzip -l "$JAR" | grep -q 'com/andres/talend/bridge/Startup.class' || (echo "faltan las clases en el jar" && exit 1)
        working-directory: talend-studio-bridge
