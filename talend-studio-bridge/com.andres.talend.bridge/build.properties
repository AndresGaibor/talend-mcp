# Configuracion del bundle.
#
# Cada clave debe ir en una sola linea: Tycho no interpreta las continuaciones
# de linea con barra invertida que usa PDE, y sin esto el jar se construye sin
# las clases o sin plugin.xml (y entonces la extension org.eclipse.ui.startup
# nunca se registra y el bundle lazy no llega a activarse).
source.. = src/
output.. = bin/
bin.includes = META-INF/,.,plugin.xml
