services:
  postgres:
    image: postgres:16-alpine
    container_name: talend_mcp_pg
    environment:
      POSTGRES_USER: talend
      POSTGRES_PASSWORD: talend
      POSTGRES_DB: talend_test
    ports:
      - "5433:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

  # HiveServer2 para las pruebas de tHive*. Impala no se emula: su driver JDBC no esta en Maven Central.
  # Los ficheros de testdata se ven en /data (LOAD DATA LOCAL INPATH '/data/...').
  hive:
    image: apache/hive:4.0.1
    container_name: talend_mcp_hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./:/data

  # S3 (emulador Moto). Los escenarios aws: usan http://127.0.0.1:4566.
  moto:
    image: motoserver/moto:latest
    container_name: talend_mcp_moto
    ports:
      - "4566:5000"

  # Emulacion anterior de Impala: HiveServer2 sin SASL en el 21050. Ya no hace falta porque el Impala real
  # (testdata/impala/quickstart.yml) escucha en ese puerto. Se deja como perfil opcional.
  impala-emu:
    profiles: ["emu"]
    image: apache/hive:4.0.1
    container_name: talend_mcp_impala_emu
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Dhive.server2.thrift.port=21050 -Dhive.server2.authentication=NOSASL"
    ports:
      - "21051:21050"

  # HDFS para tHDFSPut / tHDFSGet / tHDFSInput. Un namenode y un datanode de Apache Hadoop 3.3.6 (el cliente
  # de Talend usa Hadoop 3.3.4). El datanode anuncia localhost para que el cliente del host lo alcance.
  hdfs-namenode:
    image: apache/hadoop:3.3.6
    container_name: talend_mcp_hdfs_namenode
    command: ["hdfs", "namenode"]
    environment: &hdfs-env
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
      CORE-SITE.XML_fs.defaultFS: hdfs://hdfs-namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
      HDFS-SITE.XML_dfs.client.use.datanode.hostname: "true"
    ports:
      - "9000:9000"
      - "9870:9870"

  hdfs-datanode:
    image: apache/hadoop:3.3.6
    container_name: talend_mcp_hdfs_datanode
    command: ["hdfs", "datanode"]
    environment:
      <<: *hdfs-env
      HDFS-SITE.XML_dfs.datanode.hostname: localhost
    ports:
      - "9866:9866"
      - "9864:9864"

  # MySQL 8.4 para las pruebas de tMysql*. Misma base y usuario que Postgres (talend_test / talend).
  mysql:
    image: mysql:8.4
    container_name: talend_mcp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: talend_test
      MYSQL_USER: talend
      MYSQL_PASSWORD: talend
    ports:
      - "3307:3306"

  # MongoDB 7 para las pruebas de tMongoDB*. Usuario talend con autenticacion en la base admin.
  mongo:
    image: mongo:7
    container_name: talend_mcp_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: talend
      MONGO_INITDB_ROOT_PASSWORD: talend
    ports:
      - "27018:27017"

  # Servidor FTP para tFTP*. En modo pasivo el cliente recibe PUBLICHOST, asi que el rango 30000-30009 va publicado.
  ftp:
    image: stilliard/pure-ftpd:latest
    container_name: talend_mcp_ftp
    environment:
      PUBLICHOST: localhost
      FTP_USER_NAME: talend
      FTP_USER_PASS: talend
      FTP_USER_HOME: /home/talend
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"

  # Oracle 23 Free (imagen de comunidad) para las pruebas de tOracle*. Usuario de laboratorio talend en FREEPDB1.
  # Consume 2-4 GB: levantalo solo cuando lo uses (docker compose up -d oracle) y bajalo despues.
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: talend_mcp_oracle
    environment:
      ORACLE_PASSWORD: talend
      APP_USER: talend
      APP_USER_PASSWORD: talend
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40

  # SQL Server 2022 (imagen de desarrollo) para las pruebas de tMSSql*. Usuario de laboratorio talend en talend_test.
  # Consume 2-4 GB: levantalo solo cuando lo uses (docker compose up -d mssql) y bajalo despues.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: talend_mcp_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?definir MSSQL_SA_PASSWORD en el entorno o en .env (contrasena sa de laboratorio)}
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Db2 Community (imagen de desarrollo, licencia aceptada en el laboratorio) para las pruebas de tDB2*.
  # Necesita privilegios y 4 GB o mas: levantalo solo cuando lo uses (docker compose up -d db2) y bajalo despues.
  db2:
    image: icr.io/db2_community/db2
    container_name: talend_mcp_db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: talend
      DBNAME: talend_test
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
    ports:
      - "50001:50000"
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to talend_test' || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 60
      start_period: 300s

  # Servidor SSH con shell (SCP y tSSH). Usuario de laboratorio talend con contrasena talend. Puerto 2223 en el host.
  ssh:
    image: linuxserver/openssh-server:latest
    container_name: talend_mcp_ssh
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER_NAME: talend
      USER_PASSWORD: talend
      PASSWORD_ACCESS: "true"
    ports:
      - "2223:2222"

  # ActiveMQ Classic (broker JMS) para las pruebas de tJMS*. OpenWire en 61616 (host). Usuario admin/admin de laboratorio.
  activemq:
    image: apache/activemq-classic:latest
    container_name: talend_mcp_activemq
    ports:
      - "61616:61616"
      - "8161:8161"

volumes:
  pgdata:
